<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link href="../css/02Menu_pc.css" rel="stylesheet" />
  <title>メニュー</title>
</head>

<body>
  <div id="menu-root"></div>

  <script src="../js/data.js"></script>
  <script>
    const root = document.getElementById('menu-root');
    const table = document.createElement('table');

    for (let i = 0; i < QUEST_DATA.length; i += 2) {
      const row = document.createElement('tr');

      for (let col = 0; col < 2; col++) {
        const q = QUEST_DATA[i + col];
        if (!q) break;

        const td = document.createElement('td');
        const details = document.createElement('details');

        const summary = document.createElement('summary');
        summary.className = 'sum' + q.id;
        summary.textContent = q.title;
        details.appendChild(summary);

        const panel = document.createElement('div');
        panel.className = 'item-panel if' + q.id;

        const ul = document.createElement('ul');
        q.items.forEach(function (item) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.className = 'botton sum' + q.id;
          a.style.display = 'inline-block';
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = item.name;
          li.appendChild(a);
          ul.appendChild(li);
        });

        panel.appendChild(ul);
        details.appendChild(panel);
        td.appendChild(details);
        row.appendChild(td);
      }

      table.appendChild(row);
    }

    root.appendChild(table);
  </script>
</body>

</html>
