<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <link href="src/css/01Main_pc.css" rel="stylesheet" />
  <script type="text/javascript" src="src/js/main_pc.js" defer></script>
  <title>作業管理ページ</title>
</head>

<body>
  <!-- 星空背景レイヤー -->
  <div class="bg-stars"></div>
  <div class="bg-mountains"></div>

  <!-- UFO -->
  <div class="ufo" aria-hidden="true"></div>

  <!-- トップバー：再読込 / 現在日時 / 閉じる -->
  <div class="topbar">
    <input type="button" class="botton botton--moss" onClick="update()" value="↻ 再読込">
    <p class="realtime-wrap"><span id="realtime"></span></p>
    <input type="button" class="botton botton--red" onClick="shutdown()" value="閉じる ✕">
  </div>

  <!-- タイトルロゴ -->
  <div class="title-block" id="titleBlock">
    <p class="title-sub">─── DRAGON TASK ───</p>
    <h1 class="title-logo">作業管理</h1>
    <p class="title-tagline">THE ADVENTURE OF DAILY TASKS</p>
  </div>

  <!-- PRESS START 画面（オープニング） -->
  <div class="press-start" id="pressStart">
    <input type="button" class="botton botton--blue botton--lg press-start__text" onClick="startGame()" value="▶ PRESS START ◀">
    <p class="press-start__hint">ENTER / SPACE / CLICK</p>
  </div>
  <p class="copyright">© 26XX TASK QUEST CORP. ALL RIGHTS RESERVED.</p>

  <!-- メニュー：ゲーム開始後に表示 -->
  <div class="menu-window" id="menuWindow">
    <p class="menu-heading">── SELECT YOUR QUEST ──</p>
    <iframe src="src/html/00Menu_pc.html" class="menu-iframe" tabindex="-1"></iframe>
    <p class="menu-hint">↑↓ MOVE　Z/ENTER CONFIRM</p>
  </div>
</body>

</html>
